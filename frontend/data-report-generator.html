<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Report Generator - DOC GENIE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/docsHelper.js"></script>
    <style>
        body {
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .generator-container {
            flex: 1;
            padding: 120px 20px 60px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .upload-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: var(--transition-smooth);
        }

        .upload-section:hover {
            border-color: var(--primary-600);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.1);
        }

        /* Results Sections */
        .results-container {
            display: none;
            flex-direction: column;
            gap: 30px;
            margin-top: 30px;
        }

        .results-container.active {
            display: flex;
        }

        .results-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Preview Table */
        .preview-table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            color: var(--text-secondary);
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .chart-wrapper {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            height: 350px;
            display: flex;
            flex-direction: column;
        }

        /* Analytics Metrics */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .metric-item {
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .metric-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .metric-value { font-size: 18px; font-weight: 600; color: var(--primary-600); }

        /* Report Preview Customization */
        .report-content {
            background: #fff;
            color: #1a1a1a;
            border-radius: 12px;
            padding: 40px;
            overflow-y: auto;
            max-height: 800px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            margin: 0 auto;
        }

        .report-toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 15px;
        }

        .action-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-smooth);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .action-btn.primary { background: var(--primary-600); border-color: var(--primary-600); color: #fff; }
        .action-btn.primary:hover { background: var(--primary-700); }

        /* Existing utility styles */
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar" style="background: var(--bg-darker); border-bottom: 1px solid var(--border-color);">
        <div class="container" style="max-width: 100%; padding: 0 32px; display: flex; justify-content: space-between; align-items: center; height: 72px;">
            <a href="home.html" style="text-decoration: none; display: flex; align-items: center; gap: 12px;">
                <div style="width: 32px; height: 32px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 8px;"></div>
                <span style="font-weight: 700; font-size: 18px; color: white;">DOC GENIE</span>
            </a>
            <div style="display: flex; align-items: center; gap: 20px;">
                <a href="home.html" class="nav-link" style="color: var(--text-secondary); text-decoration: none;">Home</a>
                <!-- Settings Icon -->
                <a href="settings.html" class="icon-btn" aria-label="Settings" title="Settings" style="color: var(--text-secondary); display: flex; align-items: center;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </a>
                <div id="navAvatar" style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-600), var(--purple-600)); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white;">US</div>
                <button onclick="sessionStorage.clear(); window.location.href='login.html';" class="btn btn-secondary" style="padding: 8px 16px; border: none; cursor: pointer; background: rgba(255,255,255,0.1); color: white; border-radius: 8px;">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container generator-container">
        <!-- Upload Section -->
        <div id="uploadCard" class="upload-section">
            <div class="upload-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                </svg>
            </div>
            
            <h1 class="upload-title">Data Analytics Report Engine</h1>
            <p class="upload-subtitle">Upload your CSV or Excel dataset to automatically analyze trends, generate charts, and produce a professional report.</p>
            
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" class="file-input" accept=".csv,.xlsx,.xls">
                <label for="fileInput" class="file-input-label">Choose CSV or Excel File</label>
            </div>
            
            <div id="fileInfo" class="file-info" style="display:none; margin-top:20px; padding:15px; background:rgba(99,102,241,0.1); border-radius:12px;">
                <div id="fileName" style="font-weight:600; color:var(--primary-600);"></div>
                <div id="fileSize" style="font-size:12px; color:var(--text-secondary);"></div>
            </div>
            
            <button id="analyzeBtn" class="analyze-btn" style="display:none; margin-top:20px;" onclick="analyzeData()">
                <span>Analyze & Generate Full Report</span>
                <div id="spinner" class="loading-spinner" style="margin-left:10px;"></div>
            </button>
        </div>

        <!-- Progress Overlay -->
        <div id="progressSection" style="display:none; text-align:center; padding:40px;">
            <div class="loading-spinner" style="display:inline-block; width:50px; height:50px; border-width:4px; margin-bottom:20px;"></div>
            <h2 id="statusMessage">Processing Dataset...</h2>
        </div>

        <!-- Results Display -->
        <div id="resultsContainer" class="results-container">
            
            <!-- Data Preview -->
            <div class="results-card">
                <div class="card-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                    Dataset Preview
                </div>
                <div class="preview-table-wrapper" id="previewTable"></div>
            </div>

            <!-- Visualization Grid -->
            <div class="results-card">
                <div class="card-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                    Visual Analytics
                </div>
                <div class="charts-grid" id="chartsGrid"></div>
            </div>

            <!-- AI Report & Download -->
            <div class="results-card">
                <div class="card-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                    AI Generated Analysis Report
                </div>
                
                <div class="report-toolbar">
                    <button class="action-btn" onclick="saveToHistory()">Save</button>
                    <select id="downloadFormat" class="action-btn" style="outline:none; cursor:pointer;">
                        <option value="pdf">PDF</option>
                        <option value="docx">DOCX</option>
                    </select>
                    <button class="action-btn primary" onclick="downloadReport()">Download</button>
                </div>

                <div id="reportContent" class="report-content">
                    <!-- Formatted HTML injected here -->
                </div>
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <button class="btn btn-secondary" onclick="window.location.reload()">Process Another File</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userData = JSON.parse(sessionStorage.getItem('docgenie_user'));
            if (!userData) {
                window.location.href = 'login.html';
                return;
            }
        });

        let selectedFile = null;
        let analysisResults = null;

        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const analyzeBtn = document.getElementById('analyzeBtn');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('fileSize').textContent = (file.size / 1024).toFixed(2) + ' KB';
                fileInfo.style.display = 'block';
                analyzeBtn.style.display = 'inline-block';
            }
        });

        async function analyzeData() {
            if (!selectedFile) return;

            const uploadCard = document.getElementById('uploadCard');
            const progressSection = document.getElementById('progressSection');
            const statusMessage = document.getElementById('statusMessage');

            uploadCard.style.display = 'none';
            progressSection.style.display = 'block';
            
            statusMessage.innerHTML = "Analyzing Statistics...";
            
            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('http://localhost:5000/api/data-analytics/analyze', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    analysisResults = result;
                    renderResults(result);
                } else {
                    alert('Error: ' + result.error);
                    uploadCard.style.display = 'block';
                    progressSection.style.display = 'none';
                }
            } catch (err) {
                console.error(err);
                alert('Connection error. Please check if the backend is running.');
                uploadCard.style.display = 'block';
                progressSection.style.display = 'none';
            }
        }

        function renderResults(res) {
            document.getElementById('progressSection').style.display = 'none';
            document.getElementById('resultsContainer').classList.add('active');

            // 1. Render Preview Table
            const tableWrapper = document.getElementById('previewTable');
            let tableHtml = '<table><thead><tr>';
            const headers = Object.keys(res.dataPreview[0]);
            headers.forEach(h => tableHtml += `<th>${h}</th>`);
            tableHtml += '</tr></thead><tbody>';
            res.dataPreview.forEach(row => {
                tableHtml += '<tr>';
                headers.forEach(h => tableHtml += `<td>${row[h]}</td>`);
                tableHtml += '</tr>';
            });
            tableHtml += '</tbody></table>';
            tableWrapper.innerHTML = tableHtml;

            // 2. Render Charts
            const chartsGrid = document.getElementById('chartsGrid');
            chartsGrid.innerHTML = '';
            res.charts.forEach((chartConfig, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'chart-wrapper';
                wrapper.innerHTML = `<h4 style="margin-bottom:15px; font-size:14px; color:var(--text-secondary)">${chartConfig.title}</h4><canvas id="chart-${idx}"></canvas>`;
                chartsGrid.appendChild(wrapper);

                new Chart(document.getElementById(`chart-${idx}`), {
                    type: chartConfig.type,
                    data: chartConfig.data,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: chartConfig.type === 'pie' ? 'right' : 'top' }
                        }
                    }
                });
            });

            // 3. Inject Report HTML
            document.getElementById('reportContent').innerHTML = res.reportHtml;
        }

        async function downloadReport() {
            const format = document.getElementById('downloadFormat').value;
            const content = document.getElementById('reportContent').innerHTML;
            const title = `Report_${selectedFile.name.split('.')[0]}`;

            try {
                const res = await fetch('http://localhost:5000/api/document/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ html: content, title, format })
                });

                if (res.ok) {
                    const blob = await res.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${title.toLowerCase()}.${format}`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                }
            } catch (err) {
                alert('Download failed.');
            }
        }

        async function saveToHistory() {
            if (!analysisResults) return;
            const content = document.getElementById('reportContent').innerHTML;
            const title = `Analytical Report: ${selectedFile.name}`;
            
            try {
                // Assuming script.js is loaded and has saveDocument()
                if (typeof window.saveDocument === 'function') {
                    await window.saveDocument(content, title, 'Report', 'Data Analytics');
                    alert('Report saved to history.');
                }
            } catch (err) {
                alert('Save failed.');
            }
        }
    </script>
</body>
</html>
