<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Document Generator - DOC GENIE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: var(--bg-dark); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .workspace-container { display: flex; flex: 1; margin-top: 73px; height: calc(100vh - 73px); }
        .input-panel { width: 450px; background: var(--bg-darker); border-right: 1px solid var(--border-color); padding: 32px; overflow-y: auto; display: flex; flex-direction: column; }
        .output-panel { flex: 1; background: var(--bg-dark); padding: 32px 48px; overflow-y: auto; position: relative; display: flex; flex-direction: column; }
        .panel-header { margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border-color); }
        .panel-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); display: flex; align-items: center; gap: 12px; }
        .panel-icon { color: #ec4899; background: rgba(236,72,153,0.1); width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .panel-subtitle { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
        
        .doc-type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .doc-type-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; cursor: pointer; transition: var(--transition-smooth); text-align: center; }
        .doc-type-card:hover, .doc-type-card.active { border-color: #ec4899; background: rgba(236,72,153,0.05); transform: translateY(-2px); }
        .doc-type-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; color: var(--text-primary); }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px; }
        .form-input, .form-textarea { width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 16px; color: var(--text-primary); font-family: var(--font-primary); font-size: 14px; transition: var(--transition-smooth); }
        .form-textarea { resize: vertical; min-height: 100px; line-height: 1.5; }
        .form-input:focus, .form-textarea:focus { outline: none; border-color: #ec4899; background: rgba(0, 0, 0, 0.4); box-shadow: 0 0 0 2px rgba(236,72,153,0.1); }
        .generate-btn { margin-top: 12px; width: 100%; display: flex; justify-content: center; background: #ec4899; }
        
        .output-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; background: var(--bg-card); padding: 12px 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .output-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .toolbar-actions { display: flex; gap: 8px; }
        .action-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .action-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.05); }
        .action-btn.primary { background: rgba(236,72,153,0.1); color: #ec4899; border-color: rgba(236,72,153,0.2); }
        .editor-container { flex: 1; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .editor-content { flex: 1; padding: 24px; color: var(--text-primary); line-height: 1.8; overflow-y: auto; outline: none; }
        
        .empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-tertiary); text-align: center; }
        .loader-overlay { position: absolute; inset: 0; background: rgba(10,10,15,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; visibility: hidden; z-index: 10; transition: 0.3s; }
        .loader-overlay.active { opacity: 1; visibility: visible; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(236,72,153,0.2); border-top-color: #ec4899; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav class="navbar" style="background: var(--bg-darker); border-bottom: 1px solid var(--border-color);">
        <div class="container" style="max-width: 100%; padding: 0 32px; display: flex; justify-content: space-between; align-items: center; height: 72px;">
            <a href="home.html" style="text-decoration: none; display: flex; align-items: center; gap: 12px;">
                <div style="width: 32px; height: 32px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 8px;"></div>
                <span style="font-weight: 700; font-size: 18px; color: white;">DOC GENIE</span>
            </a>
            <a href="home.html" class="nav-link" style="color: var(--text-secondary); text-decoration: none;">Back to Home</a>
        </div>
    </nav>

    <div class="workspace-container">
        <!-- Left Panel -->
        <div class="input-panel">
            <div class="panel-header">
                <h1 class="panel-title">
                    <div class="panel-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                    Legal Generator
                </h1>
                <p class="panel-subtitle">Select a document type to begin generating structured legal content.</p>
            </div>

            <!-- Selection Grid -->
            <div id="selectionStep">
                <h3 style="font-size: 14px; margin-bottom: 12px; color: var(--text-secondary);">Select Document Type</h3>
                <div class="doc-type-grid" id="docTypeGrid">
                    <!-- Javascript populates this -->
                </div>
            </div>

            <!-- Template Selection Step -->
            <div id="templateStep" style="display: none;">
                <button id="btnBackToDocType" style="background: none; border: none; color: #ec4899; cursor: pointer; margin-bottom: 20px; font-size: 13px; display: flex; align-items: center; gap: 6px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Change Type
                </button>
                <h3 style="font-size: 14px; margin-bottom: 12px; color: var(--text-secondary);">Select Template</h3>
                <div class="doc-type-grid" id="templateGrid">
                    <!-- Javascript populates this with available templates -->
                </div>
            </div>

            <!-- Dynamic Form -->
            <div id="formStep" style="display: none;">
                <button id="btnBackToTemplate" style="background: none; border: none; color: #ec4899; cursor: pointer; margin-bottom: 20px; font-size: 13px; display: flex; align-items: center; gap: 6px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Change Template
                </button>
                <form id="dynamicForm">
                    <input type="hidden" id="selectedTemplateRef" name="templateRef" value="standard">
                    <div id="dynamicFieldsContainer"></div>
                    <button type="submit" class="btn btn-primary generate-btn">Generate Document</button>
                </form>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="output-panel">
            <div class="output-toolbar">
                <div class="output-title" id="outputTitle">Document Preview</div>
                    <button class="action-btn" id="btnHistorySave" title="Save to history">Save</button>
                    <div style="display: flex; align-items: center; gap: 8px; margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--border-color);">
                        <select id="downloadFormat" class="action-btn" style="outline: none; background: rgba(255,255,255,0.05); color: var(--text-primary);">
                            <option value="pdf" style="color: black;">PDF</option>
                            <option value="docx" style="color: black;">DOCX</option>
                        </select>
                        <button class="action-btn primary" id="btnDownload">Download</button>
                    </div>
                </div>
            </div>
            <div class="editor-container">
                <div class="empty-state" id="emptyState">
                    <div>Select a document type and fill out the form to generate.</div>
                </div>

    <!-- Template Preview Modal -->
    <div id="previewModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:100; align-items:center; justify-content:center;">
        <div style="width: 80%; height: 90%; background: var(--bg-dark); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--border-color);">
            <div style="padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                <h3 style="color: var(--text-primary); margin: 0; font-size: 16px;">Template Preview</h3>
                <button id="closePreviewBtn" style="background: none; border: none; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
             <!-- PDF Iframe -->
            <iframe id="previewIframe" style="flex: 1; border: none; width: 100%; height: 100%;" src=""></iframe>
        </div>
    </div>
                <!-- Where formatted HTML sits -->
                <div id="outputContent" class="editor-content" style="display: none;"></div>
                <!-- Where raw unformatted AI string sits (hidden) -->
                <div id="rawContent" style="display: none;"></div>

                <div class="loader-overlay" id="loaderOverlay">
                    <div class="spinner"></div>
                    <div style="color: white; font-size: 14px;">Generating professional document...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/docsHelper.js"></script>
    <script>
        const templates = {
            "Non Disclosure Agreement (NDA)": [
                { name: "title", label: "Document Title", type: "text" },
                { name: "party_a", label: "Party A (Disclosing Party)", type: "text" },
                { name: "party_b", label: "Party B (Receiving Party)", type: "text" },
                { name: "purpose", label: "Purpose of Agreement", type: "text" },
                { name: "duration", label: "Duration (e.g., 2 years)", type: "text" },
                { name: "jurisdiction", label: "Jurisdiction (e.g., State)", type: "text" },
                { name: "instructions", label: "Additional Instructions", type: "textarea" }
            ],
            "Service Agreement": [
                { name: "title", label: "Document Title", type: "text" },
                { name: "party_a", label: "Service Provider (Party A)", type: "text" },
                { name: "party_b", label: "Client (Party B)", type: "text" },
                { name: "agreement_terms", label: "Agreement Terms", type: "textarea" },
                { name: "duration", label: "Duration / Timeline", type: "text" },
                { name: "jurisdiction", label: "Jurisdiction", type: "text" },
                { name: "instructions", label: "Additional Instructions", type: "textarea" }
            ],
            "Employment Contract": [
                { name: "title", label: "Document Title", type: "text" },
                { name: "party_a", label: "Employer", type: "text" },
                { name: "party_b", label: "Employee", type: "text" },
                { name: "agreement_terms", label: "Job Description", type: "textarea" },
                { name: "duration", label: "Start Date / Duration", type: "text" },
                { name: "jurisdiction", label: "Jurisdiction", type: "text" },
                { name: "instructions", label: "Additional Instructions", type: "textarea" }
            ],
            "Rental Agreement": [
                { name: "title", label: "Document Title", type: "text" },
                { name: "party_a", label: "Landlord", type: "text" },
                { name: "party_b", label: "Tenant", type: "text" },
                { name: "agreement_terms", label: "Property Address & Terms", type: "textarea" },
                { name: "duration", label: "Lease Term", type: "text" },
                { name: "jurisdiction", label: "Jurisdiction", type: "text" },
                { name: "instructions", label: "Additional Instructions", type: "textarea" }
            ],
            "Privacy Policy": [
                { name: "title", label: "Document Title", type: "text" },
                { name: "organization", label: "Company/Organization Name", type: "text" },
                { name: "key_points", label: "Data Collected & Usage", type: "textarea" },
                { name: "jurisdiction", label: "Jurisdiction", type: "text" },
                { name: "instructions", label: "Additional Instructions", type: "textarea" }
            ],
            "Terms and Conditions": [
                { name: "title", label: "Document Title", type: "text" },
                { name: "organization", label: "Company/Website Name", type: "text" },
                { name: "key_points", label: "Key Rules / Guidelines", type: "textarea" },
                { name: "jurisdiction", label: "Jurisdiction", type: "text" },
                { name: "instructions", label: "Additional Instructions", type: "textarea" }
            ]
        };

        let currentSelectedType = null;
        let availableTemplatesData = [];

        document.addEventListener('DOMContentLoaded', () => {
            const docTypeGrid = document.getElementById('docTypeGrid');
            const selectionStep = document.getElementById('selectionStep');
            const templateStep = document.getElementById('templateStep');
            const formStep = document.getElementById('formStep');
            const templateGrid = document.getElementById('templateGrid');
            const dynamicFieldsContainer = document.getElementById('dynamicFieldsContainer');
            
            const btnBackToDocType = document.getElementById('btnBackToDocType');
            const btnBackToTemplate = document.getElementById('btnBackToTemplate');
            const dynamicForm = document.getElementById('dynamicForm');
            const selectedTemplateRefInput = document.getElementById('selectedTemplateRef');
            
            const emptyState = document.getElementById('emptyState');
            const outputContent = document.getElementById('outputContent');
            const rawContent = document.getElementById('rawContent');
            const loaderOverlay = document.getElementById('loaderOverlay');

            const previewModal = document.getElementById('previewModal');
            const previewIframe = document.getElementById('previewIframe');
            const closePreviewBtn = document.getElementById('closePreviewBtn');

            // Render Document Type Grid
            Object.keys(templates).forEach(type => {
                const card = document.createElement('div');
                card.className = 'doc-type-card';
                card.innerHTML = `<div class="doc-type-title">${type}</div>`;
                card.onclick = () => selectType(type);
                docTypeGrid.appendChild(card);
            });

            async function selectType(type) {
                currentSelectedType = type;
                selectionStep.style.display = 'none';
                
                // Fetch Templates for this Type
                try {
                    const encodedType = encodeURIComponent(type);
                    const res = await fetch(`http://localhost:5000/api/templates/category/legal/type/${encodedType}`);
                    const data = await res.json();
                    
                    if (data.success && data.templates.length > 0) {
                        availableTemplatesData = data.templates;
                        renderTemplateGrid();
                        templateStep.style.display = 'block';
                    } else {
                        // Fallback to form directly if API fails or no templates configured
                        console.warn('No templates found, bypassing template step.');
                        selectedTemplateRefInput.value = 'standard';
                        renderForm(type, 'standard');
                        formStep.style.display = 'block';
                    }
                } catch (err) {
                    console.error('Failed to fetch templates:', err);
                    selectedTemplateRefInput.value = 'standard';
                    renderForm(type, 'standard');
                    formStep.style.display = 'block';
                }
            }

            function renderTemplateGrid() {
                templateGrid.innerHTML = '';
                availableTemplatesData.forEach(tmpl => {
                    const card = document.createElement('div');
                    card.className = 'doc-type-card';
                    card.innerHTML = `
                        <div class="doc-type-title" style="margin-bottom:8px;">${tmpl.name}</div>
                        <p style="font-size:12px; color:var(--text-secondary); margin-bottom:12px;">${tmpl.description}</p>
                        <div style="display:flex; gap:8px; justify-content:center;">
                            ${tmpl.previewUrl ? `<button type="button" class="btn action-btn primary preview-btn" data-url="${tmpl.previewUrl}" style="background:rgba(236,72,153,0.1); border-color:transparent; flex:1;">Preview Target</button>` : ''}
                            <button type="button" class="btn action-btn select-tmpl-btn" data-id="${tmpl.id}" style="background:#ec4899; color:#fff; border-color:transparent; flex:1;">Use This</button>
                        </div>
                    `;
                    templateGrid.appendChild(card);
                });

                // Attach Events
                templateGrid.querySelectorAll('.select-tmpl-btn').forEach(btn => {
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        const tmplId = btn.getAttribute('data-id');
                        selectTemplate(tmplId);
                    };
                });

                templateGrid.querySelectorAll('.preview-btn').forEach(btn => {
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        const url = btn.getAttribute('data-url');
                        openPreview(url);
                    };
                });
            }

            function openPreview(url) {
                previewIframe.src = `http://localhost:5000${url}#toolbar=0`;
                previewModal.style.display = 'flex';
            }

            closePreviewBtn.onclick = () => {
                previewModal.style.display = 'none';
                previewIframe.src = '';
            };

            function selectTemplate(templateId) {
                templateStep.style.display = 'none';
                selectedTemplateRefInput.value = templateId;
                renderForm(currentSelectedType, templateId);
                formStep.style.display = 'block';
            }

            btnBackToDocType.onclick = () => {
                templateStep.style.display = 'none';
                selectionStep.style.display = 'block';
                currentSelectedType = null;
            };

            btnBackToTemplate.onclick = () => {
                formStep.style.display = 'none';
                templateStep.style.display = 'block';
            };

            function renderForm(type, templateId) {
                dynamicFieldsContainer.innerHTML = '';
                
                // If a specific custom template ruleset exists from fetch, use its structure
                let fieldsToRender = templates[type];
                
                const customTemplate = availableTemplatesData.find(t => t.id === templateId);
                if (customTemplate && customTemplate.structure && customTemplate.structure.length > 0) {
                    fieldsToRender = customTemplate.structure;
                }

                fieldsToRender.forEach(f => {
                    const group = document.createElement('div');
                    group.className = 'form-group';
                    const requiredAttr = f.name !== 'instructions' ? 'required' : '';
                    
                    let inputHtml = '';
                    if (f.type === 'textarea') {
                        inputHtml = `<textarea id="field_${f.name}" name="${f.name}" class="form-textarea" ${requiredAttr}></textarea>`;
                    } else {
                        inputHtml = `<input type="text" id="field_${f.name}" name="${f.name}" class="form-input" ${requiredAttr}>`;
                    }

                    group.innerHTML = `<label class="form-label">${f.label}</label>${inputHtml}`;
                    dynamicFieldsContainer.appendChild(group);
                });
            }

            dynamicForm.onsubmit = async (e) => {
                e.preventDefault();
                
                const fieldData = {};
                const inputs = dynamicForm.querySelectorAll('.form-input, .form-textarea, input[type="hidden"]');
                inputs.forEach(input => {
                    if (input.value.trim()) {
                        fieldData[input.name] = input.value.trim();
                    }
                });

                emptyState.style.display = 'none';
                outputContent.style.display = 'none';
                loaderOverlay.classList.add('active');

                try {
                    const res = await fetch('http://localhost:5000/api/legal-doc/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            documentType: currentSelectedType,
                            fieldData
                        })
                    });

                    const data = await res.json();
                    
                    if (data.success) {
                        outputContent.innerHTML = data.data.formattedHtml;
                        rawContent.innerHTML = data.data.rawHtml;
                        outputContent.style.display = 'block';

                        // Auto-save to history
                        if (window.saveDocument) {
                            window.saveDocument(data.data.formattedHtml, currentSelectedType, 'Legal', 'Generator');
                        }
                    } else {
                        alert('Error: ' + data.error);
                        emptyState.style.display = 'flex';
                    }
                } catch (err) {
                    console.error('API Error:', err);
                    alert('Error connecting to backend.');
                    emptyState.style.display = 'flex';
                } finally {
                    loaderOverlay.classList.remove('active');
                }
            };

            // Manual save to history
            document.getElementById('btnHistorySave').onclick = async () => {
                if(outputContent.style.display === 'none' || !outputContent.innerHTML) return;
                try {
                    if (window.saveDocument) {
                        const originalHTML = document.getElementById('btnHistorySave').innerHTML;
                        document.getElementById('btnHistorySave').innerHTML = 'Saving...';
                        await window.saveDocument(outputContent.innerHTML, currentSelectedType, 'Legal', 'Generator');
                        document.getElementById('btnHistorySave').innerHTML = 'Saved';
                        setTimeout(() => { document.getElementById('btnHistorySave').innerHTML = originalHTML; }, 2000);
                    }
                } catch (err) { console.error(err); }
            };

            // Standardized Download logic
            document.getElementById('btnDownload').onclick = async () => {
                if(outputContent.style.display === 'none' || !outputContent.innerHTML) return;
                
                const format = document.getElementById('downloadFormat').value;
                const btnDownload = document.getElementById('btnDownload');
                const originalContent = btnDownload.innerHTML;
                btnDownload.innerHTML = 'Downloading...';
                btnDownload.disabled = true;
                
                try {
                    const response = await fetch('http://localhost:5000/api/document/download', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            html: outputContent.innerHTML,
                            title: currentSelectedType,
                            format: format
                        })
                    });

                    if (response.ok) {
                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${currentSelectedType.replace(/ /g, '_')}.${format}`;
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                    } else {
                        alert(`Failed to download document as ${format.toUpperCase()}`);
                    }
                } catch (err) {
                    alert('Error downloading document.');
                } finally {
                    btnDownload.innerHTML = originalContent;
                    btnDownload.disabled = false;
                }
            };
        });
    </script>
</body>
</html>
