<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Documents - DOC GENIE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --sidebar-width: 280px;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            padding: 30px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 100;
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 40px;
            max-width: calc(100vw - var(--sidebar-width));
        }

        .sidebar-logo {
            margin-bottom: 50px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition-smooth);
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-600);
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
        }

        /* Dashboard Header */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-600), var(--purple-600));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
        }

        /* Grid Layout for Documents */
        .docs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .doc-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            transition: var(--transition-smooth);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .doc-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-600);
            box-shadow: 0 10px 40px rgba(99, 102, 241, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .doc-icon {
            width: 44px;
            height: 44px;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-600);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .doc-title {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .doc-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 100px;
            text-transform: uppercase;
        }

        .badge-type { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .badge-source { background: rgba(139, 92, 246, 0.1); color: #8b5cf6; }

        .doc-date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition-smooth);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-delete {
            flex: 0 0 40px;
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.1);
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
        }

        /* Search Section */
        .search-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 32px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .search-bar {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-bar input {
            background: none;
            border: none;
            color: white;
            outline: none;
            width: 100%;
            font-size: 15px;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 32px;
            overflow-y: auto;
            color: var(--text-primary);
            line-height: 1.8;
            font-size: 16px;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: var(--transition-smooth);
        }

        .close-modal:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .download-options {
            display: flex;
            gap: 10px;
            padding: 24px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--border-color);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
        }

        .empty-state h2 {
            font-family: var(--font-display);
            margin-bottom: 12px;
        }

        .empty-state p {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .logout-btn {
            margin-top: auto;
            color: #ef4444;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                        <rect width="32" height="32" rx="8" fill="url(#sidebar-grad)"/>
                        <path d="M16 8L22 12V20L16 24L10 20V12L16 8Z" stroke="white" stroke-width="2"/>
                        <circle cx="16" cy="16" r="3" fill="white"/>
                        <defs><linearGradient id="sidebar-grad"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
                    </svg>
                </div>
                <span class="logo-text">DOC GENIE</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Overview
            </a>
            <a href="home.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                Generators
            </a>
            <a href="documents.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                My Documents
            </a>
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                My Templates
            </a>
            <a href="#" class="nav-item logout-btn" onclick="logout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Logout
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="dashboard-header">
            <div>
                <h1 style="font-family: var(--font-display); font-size: 28px;">My Documents</h1>
                <p style="color: var(--text-secondary);">Previously created, generated, or formatted documents</p>
            </div>
            <div class="user-profile">
                <div class="avatar" id="userAvatar">U</div>
                <div>
                    <div id="userName" style="font-weight: 600;">User Name</div>
                    <div id="userEmail" style="font-size: 12px; color: var(--text-secondary);">user@example.com</div>
                </div>
            </div>
        </header>

        <!-- Search -->
        <div class="search-section">
            <div class="search-bar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Search by title or document type...">
            </div>
            <a href="professional-generator.html" class="btn btn-primary" style="padding: 12px 24px;">New Document</a>
        </div>

        <!-- Documents List -->
        <div id="docsContainer" class="docs-grid">
            <!-- Documents will be loaded here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <h2>No documents created yet.</h2>
            <p>Start generating high-quality documents with AI.</p>
            <a href="professional-generator.html" class="btn btn-primary">Create New Document</a>
        </div>
    </main>

    <!-- Preview Modal -->
    <div id="previewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" class="doc-title" style="font-size: 20px;">Document Preview</h2>
                <button class="close-modal" id="closeModal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="modalBody" class="modal-body">
                <!-- Document content will be injected here -->
            </div>
            <div class="download-options">
                <button class="action-btn" id="modalDownloadPDF" style="background: var(--primary-600); color: white; border: none;">Download PDF</button>
                <button class="action-btn" id="modalDownloadDOCX">Download DOCX</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userData = JSON.parse(sessionStorage.getItem('docgenie_user'));
            if (!userData) {
                window.location.href = 'login.html';
                return;
            }

            // Update Header
            const fullName = userData.user_metadata?.full_name || 'Genie';
            document.getElementById('userName').textContent = fullName;
            document.getElementById('userEmail').textContent = userData.email;
            document.getElementById('userAvatar').textContent = fullName.charAt(0).toUpperCase();

            loadDocuments(userData.id);

            // Search
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const cards = document.querySelectorAll('.doc-card');
                cards.forEach(card => {
                    const title = card.querySelector('.doc-title').textContent.toLowerCase();
                    const type = card.querySelector('.badge-type').textContent.toLowerCase();
                    card.style.display = (title.includes(term) || type.includes(term)) ? 'flex' : 'none';
                });
            });

            // Close Modal
            document.getElementById('closeModal').addEventListener('click', () => {
                document.getElementById('previewModal').style.display = 'none';
            });
        });

        async function loadDocuments(userId) {
            const container = document.getElementById('docsContainer');
            const emptyState = document.getElementById('emptyState');
            
            try {
                const response = await fetch(`http://127.0.0.1:5000/api/documents?userId=${userId}`);
                const data = await response.json();

                if (data.success) {
                    if (data.documents.length === 0) {
                        emptyState.style.display = 'block';
                        container.innerHTML = '';
                    } else {
                        emptyState.style.display = 'none';
                        renderDocuments(data.documents);
                    }
                }
            } catch (err) {
                console.error('Error fetching documents:', err);
            }
        }

        function renderDocuments(documents) {
            const container = document.getElementById('docsContainer');
            container.innerHTML = '';

            documents.forEach(doc => {
                const card = document.createElement('div');
                card.className = 'doc-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="doc-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                        </div>
                        <div class="doc-date">${new Date(doc.created_at).toLocaleDateString()}</div>
                    </div>
                    <div>
                        <h3 class="doc-title">${doc.title}</h3>
                        <div class="doc-meta">
                            <span class="badge badge-type">${doc.document_type || 'General'}</span>
                            <span class="badge badge-source">${doc.source || 'Doc Genie'}</span>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="action-btn" onclick="previewDoc('${doc.id}')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            Preview
                        </button>
                        <button class="action-btn" onclick="downloadDoc('${doc.id}', 'pdf')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            PDF
                        </button>
                        <button class="action-btn btn-delete" onclick="deleteDoc('${doc.id}')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function previewDoc(id) {
            try {
                const res = await fetch(`http://127.0.0.1:5000/api/documents/${id}`);
                const data = await res.json();
                
                if (data.success) {
                    const doc = data.document;
                    document.getElementById('modalTitle').textContent = doc.title;
                    document.getElementById('modalBody').innerHTML = doc.content || '<p>No preview available.</p>';
                    document.getElementById('previewModal').style.display = 'flex';
                    
                    // Update modal download buttons
                    document.getElementById('modalDownloadPDF').onclick = () => downloadDoc(id, 'pdf');
                    document.getElementById('modalDownloadDOCX').onclick = () => downloadDoc(id, 'docx');
                }
            } catch (err) {
                console.error('Error fetching preview:', err);
            }
        }

        async function downloadDoc(id, format) {
            try {
                const res = await fetch(`http://127.0.0.1:5000/api/documents/${id}`);
                const data = await res.json();
                
                if (data.success) {
                    const doc = data.document;
                    
                    // Call backend export API
                    const exportRes = await fetch('http://127.0.0.1:5000/api/documents/export', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            html: doc.content,
                            title: doc.title,
                            format: format
                        })
                    });

                    if (exportRes.ok) {
                        const blob = await exportRes.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${doc.title}.${format}`;
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                    }
                }
            } catch (err) {
                console.error('Error downloading document:', err);
            }
        }

        async function deleteDoc(id) {
            if (!confirm('Are you sure you want to delete this document?')) return;
            
            try {
                const res = await fetch(`http://127.0.0.1:5000/api/documents/${id}`, {
                    method: 'DELETE'
                });
                const data = await res.json();
                
                if (data.success) {
                    const userData = JSON.parse(sessionStorage.getItem('docgenie_user'));
                    loadDocuments(userData.id);
                }
            } catch (err) {
                console.error('Error deleting document:', err);
            }
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
