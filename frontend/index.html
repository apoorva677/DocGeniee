<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOC GENIE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1>DOC GENIE</h1>
        <button id="logout-btn" style="display: none;">Logout</button>
    </header>
    
    <main class="container">
        <!-- Auth Section -->
        <section id="auth-section">
            <h2>Login or Register</h2>
            <form id="auth-form">
                <label for="username">Username:</label>
                <input type="text" id="username" required>
                <label id="email-label" for="email" style="display:none;">Email:</label>
                <input type="email" id="email" style="display:none;">
                <label for="password">Password:</label>
                <input type="password" id="password" required>
                
                <button type="button" id="login-btn">Login</button>
                <button type="button" id="register-btn">Register</button>
            </form>
            <p id="auth-message" style="color:red;"></p>
        </section>

        <!-- App Section -->
        <div id="app-section" style="display: none;">
            <section id="input-section">
                <h2>Document Input</h2>
                <form id="document-form">
                    <label for="title">Document Title:</label>
                    <input type="text" id="title" name="title" required>
                    
                    <label for="type">Document Type:</label>
                    <select id="type" name="type">
                        <option value="Academic">Academic</option>
                        <option value="Technical">Technical</option>
                        <option value="Business">Business</option>
                        <option value="Proposal">Proposal</option>
                    </select>
                    
                    <label for="template">Template Selection:</label>
                    <select id="template" name="template">
                        <option value="Default">Default</option>
                    </select>
                    
                    <label for="style">Formatting Style:</label>
                    <select id="style" name="style">
                        <option value="Standard">Standard</option>
                        <option value="Formal">Formal</option>
                        <option value="Modern">Modern</option>
                    </select>
                    
                    <label for="content">Content:</label>
                    <textarea id="content" name="content" rows="10" required></textarea>
                    
                    <button type="button" id="generate-btn">Generate Document</button>
                </form>
            </section>
            
            <section id="preview-section">
                <h2>Document Editor & Preview</h2>
                <div id="editor-container" style="height: 300px; background: white; color: black;"></div>
                <button type="button" id="export-btn" style="margin-top: 15px;">Export Document</button>
            </section>
        </div>
    </main>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="script.js"></script>
</body>
</html>
